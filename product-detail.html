<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | GymPro</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .product-detail-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
    }
    .product-detail-img {
      width: 100%;
      border-radius: var(--border-radius);
      border: 1px solid var(--glass-border);
    }
    .product-detail-info h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .product-detail-price {
      font-size: 2rem;
      color: var(--accent-neon);
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    .product-detail-desc {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    @media (max-width: 768px) {
      .product-detail-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav-wrapper">
      <nav>
        <a href="index.html" class="logo">GYM<span>PRO</span></a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="products.html" class="active">Products</a>
          <a href="contact.html">Contact Us</a>
        </div>
        <a href="cart.html" class="cart-icon">
          🛒
          <span class="cart-badge" id="cart-badge" style="display: none;">0</span>
        </a>
      </nav>
    </div>
  </header>

  <section class="container py-4" id="product-detail-content">
    <!-- Details populated via JS -->
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 GymPro Fitness. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
