<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | GymPro</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W1W1F5SFZ2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-W1W1F5SFZ2');
  </script>
</head>

<body>

  <header>
    <div class="container nav-wrapper">
      <nav>
        <a href="index.html" class="logo">GYM<span>PRO</span></a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="contact.html">Contact Us</a>
        </div>
        <a href="cart.html" class="cart-icon active">
          🛒
          <span class="cart-badge" id="cart-badge" style="display: none;">0</span>
        </a>
      </nav>
    </div>
  </header>

  <section class="container py-4">
    <h1 class="mb-2">Shopping Cart</h1>

    <div class="cart-container">
      <div class="cart-items" id="cart-items-container">
        <!-- Cart items loaded via JS -->
      </div>

      <div class="cart-summary">
        <h2>Order Summary</h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cart-subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span>Free</span>
        </div>
        <div class="summary-total">
          <span>Total</span>
          <span id="cart-total">$0.00</span>
        </div>
        <a href="checkout.html" class="btn-primary" style="width: 100%; margin-top: 1rem;">Proceed to Checkout</a>
      </div>
    </div>

  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 GymPro Fitness. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
