<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | GymPro</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W1W1F5SFZ2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-W1W1F5SFZ2');
  </script>
</head>

<body>

  <header>
    <div class="container nav-wrapper">
      <nav>
        <a href="index.html" class="logo">GYM<span>PRO</span></a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="contact.html">Contact Us</a>
        </div>
        <a href="cart.html" class="cart-icon">
          🛒
          <span class="cart-badge" id="cart-badge" style="display: none;">0</span>
        </a>
      </nav>
    </div>
  </header>

  <section class="container py-4">
    <div class="checkout-container">
      <h1 class="mb-2 text-center">Checkout</h1>

      <div class="payment-methods">
        <div class="payment-method active" id="method-credit" onclick="selectPaymentMethod('credit')">Credit Card</div>
        <div class="payment-method" id="method-debit" onclick="selectPaymentMethod('debit')">Debit Card</div>
        <div class="payment-method" id="method-paypal" onclick="selectPaymentMethod('paypal')">PayPal</div>
      </div>

      <form id="checkout-form">
        <!-- Credit / Debit Card Form (Shared layout for dummy purposes) -->
        <div id="form-credit" class="payment-form active">
          <div class="form-group">
            <label class="form-label">Name on Card</label>
            <input type="text" class="form-control" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label class="form-label">Card Number</label>
            <input type="text" class="form-control" placeholder="XXXX-XXXX-XXXX-XXXX" required>
          </div>
          <div style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Expiry</label>
              <input type="text" class="form-control" placeholder="MM/YY" required>
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">CVV</label>
              <input type="text" class="form-control" placeholder="123" required>
            </div>
          </div>
        </div>

        <div id="form-debit" class="payment-form">
          <div class="form-group">
            <label class="form-label">Name on Debit Card</label>
            <input type="text" class="form-control" placeholder="John Doe">
          </div>
          <div class="form-group">
            <label class="form-label">Card Number</label>
            <input type="text" class="form-control" placeholder="XXXX-XXXX-XXXX-XXXX">
          </div>
        </div>

        <!-- PayPal Form -->
        <div id="form-paypal" class="payment-form">
          <div class="form-group">
            <label class="form-label">PayPal Email</label>
            <input type="email" class="form-control" placeholder="you@example.com">
          </div>
          <p class="text-muted mb-2 text-center">You will be securely redirected to PayPal to complete your purchase.
          </p>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 2rem;">Complete Payment</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 GymPro Fitness. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
