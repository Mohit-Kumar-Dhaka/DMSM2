<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | GymPro</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W1W1F5SFZ2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-W1W1F5SFZ2');

<body>

  <header>
    <div class="container nav-wrapper">
      <nav>
        <a href="index.html" class="logo">GYM<span>PRO</span></a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="contact.html" class="active">Contact Us</a>
        </div>
        <a href="cart.html" class="cart-icon">
          🛒
          <span class="cart-badge" id="cart-badge" style="display: none;">0</span>
        </a>
      </nav>
    </div>
  </header>

  <section class="container py-4">
    <div class="checkout-container">
      <h1 class="mb-2 text-center">Get In Touch</h1>
      <p class="text-center text-muted mb-2">Have a question about our equipment or your order? Fill out the form below
        and our team will get back to you shortly.</p>

      <form onsubmit="event.preventDefault(); alert('Message sent successfully!'); this.reset();">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="Your Name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" placeholder="Your Email" required>
        </div>
        <div class="form-group">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="5" placeholder="How can we help you?" required></textarea>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Send Message</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 GymPro Fitness. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
